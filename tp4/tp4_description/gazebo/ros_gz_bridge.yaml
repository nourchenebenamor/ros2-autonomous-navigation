# the command for the robot
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ  # Default "BIDIRECTIONAL" - Bridge both directions
  
# the LiDAR data
- ros_topic_name: "lidar"
  gz_topic_name: "lidar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS  # Default "BIDIRECTIONAL" - Bridge both directions

# the state of the robot's joints
- ros_topic_name: "joint_states"
  gz_topic_name: "world/my_world/model/tp4_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS  # Default "BIDIRECTIONAL" - Bridge both directions

# # the odometry
# - ros_topic_name: "odom"
#   gz_topic_name: "odom"
#   ros_type_name: "nav_msgs/msg/Odometry"
#   gz_type_name: "gz.msgs.Odometry"
#   direction: GZ_TO_ROS

# the ground truth (the position of the robot)
- ros_topic_name: "pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_topic_name: "model/tp4_robot/pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

# the simulated clock
- ros_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_topic_name: "/world/my_world/clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
